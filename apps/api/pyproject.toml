[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wtr-api"
version = "0.1.0"
description = "Independent tournament workers for What's Their Range?"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pokerkit==0.7.7", "httpx>=0.28,<1", "langgraph>=1,<2", "langsmith>=0.4,<1", "sqlalchemy>=2,<3", "psycopg[binary]>=3.2,<4", "python-dotenv>=1,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "jsonschema>=4,<5"]

[tool.setuptools.packages.find]
include = ["wtr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
wtr = ["prompts/*.txt"]
