# Review the app name and region before deploying. No resources are provisioned.
app = "whats-their-range-api"
primary_region = "sin"
[build]
  dockerfile = "Dockerfile"
[env]
  WTR_PUBLIC = "true"
  LANGSMITH_TRACING = "false"
  AGENT_MAX_CALLS = "100"
[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"
[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory = "1gb"
